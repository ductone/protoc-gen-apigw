version: "2"

linters:
  default: none
  # goimports and tenv run as pinned companions in tools/lint-go.sh.
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck # Includes the former gosimple (S) family.
    - typecheck
    - unused
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - errorlint
    - exhaustive
    - forbidigo
    - goconst
    - gocritic
    - godot
    - gomoddirectives
    - gosec
    - goprintffuncname
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - predeclared
    - revive
    - tparallel
    - unconvert
    - usestdlibvars
    - whitespace

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      settings:
        underef:
          skipRecvDeref: false
    godot:
      period: true
      # Preserve the existing TODO-comment exception using godot's native setting.
      exclude: ['(TODO)']
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    nakedret:
      max-func-lines: 0
    nolintlint:
      allow-no-explanation: [forbidigo, tracecheck, gomnd, gochecknoinits, makezero]
      require-explanation: true
      require-specific: true
    revive:
      ignore-generated-header: true
      severity: error
      rules:
        - name: atomic
        - name: line-length-limit
          arguments: [200]
        - name: unhandled-error
          arguments:
            - fmt.Printf
            - fmt.Println
            - fmt.Fprintf
            - fmt.Fprintln
            - os.Stderr.Sync
            - sb.WriteString
            - buf.WriteString
            - hasher.Write
            - os.Setenv
            - os.RemoveAll
        - name: var-naming
          arguments: [["ID", "URL", "HTTP", "API"], []]

  exclusions:
    # Match the old generated-header policy, not a new source/path exclusion.
    generated: lax
    rules:
      # Only SA/S were enabled before. rc.17's staticcheck.checks selector is
      # not applied; enumerate the additional ST/QF IDs from its pinned v0.8.1.
      - path: '.*'
        linters:
          - ST1000
          - ST1001
          - ST1003
          - ST1005
          - ST1006
          - ST1008
          - ST1011
          - ST1012
          - ST1013
          - ST1015
          - ST1016
          - ST1017
          - ST1018
          - ST1019
          - ST1020
          - ST1021
          - ST1022
          - ST1023
          - QF1001
          - QF1002
          - QF1003
          - QF1004
          - QF1005
          - QF1006
          - QF1007
          - QF1008
          - QF1009
          - QF1010
          - QF1011
          - QF1012
      # Old CI's implicit G304 filter covered intentional local debug-file input.
      # Keep only this reviewed site, not the whole legacy security preset.
      - path: '^main\.go$'
        linters: [gosec]
        text: '^G304: Potential file inclusion via variable$'
      # The compiled-generator fixture uses only literal, allowlisted tools and
      # repository-owned fixture files. Preserve its old message-filter intent.
      - path: '^internal/apigw/enum_query_test\.go$'
        linters: [gosec]
        text: '^G(204: Subprocess launched with variable|304: Potential file inclusion via variable)$'
      # The old noctx v0.1.0 checked HTTP APIs, not these fixture subprocesses.
      - path: '^internal/apigw/enum_query_test\.go$'
        linters: [noctx]
        text: '^os/exec\.Command must not be called\. use os/exec\.CommandContext$'

issues:
  max-same-issues: 50
