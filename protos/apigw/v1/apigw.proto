syntax = "proto3";

package apigw.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/ductone/protoc-gen-apigw/apigw/v1";

// TODO(pquerna): register here
// https://github.com/protocolbuffers/protobuf/blob/master/docs/options.md
extend google.protobuf.ServiceOptions {
  ServiceOptions service = 7650;
}

extend google.protobuf.MethodOptions {
  MethodOptions method = 7651;
}

extend google.protobuf.FieldOptions {
  FieldOptions field = 7652;
}

extend google.protobuf.MessageOptions {
  MessageOptions message = 7653;
}

message MessageOptions {
  repeated MessageOption message_options = 1;
}

message MessageOption {
  TerraformEntity terraform_entity = 1;
  string title = 2;
  // Messages are only exposed if they are in (or descend from) an RPC service.
  // This option overrides that by forcing generation of this (and referenced) message.
  bool force_expose = 3;

  // Set this to process this message as the body of a webhook
  string webhook_request_name = 4;

  // Override the x-speakeasy-name-override value for this message in the
  // generated OpenAPI spec. Use this to resolve name collisions when two
  // messages in different packages share the same short name (e.g., "Field").
  string name_override = 5;
}

message FieldOption {
  // Sets the field as required in the generated openAPI spec.
  bool required_spec = 1;
  // Sets the field as read only in the generated openAPI spec.
  bool read_only_spec = 2;
  // Sets the stability level for this field
  Stability stability = 3;
  // Sets deprecation information for this field
  Deprecation deprecation = 4;
  // Marks a map<string, string> field as a C1 object-annotation bag.
  // Codegen emits an x-speakeasy-terraform-plan-modifier extension.
  bool annotation_bag = 5;
}

message FieldOptions {
  repeated FieldOption field_options = 1;
}

enum Stability {
  STABILITY_UNSPECIFIED = 0;
  STABILITY_DRAFT = 1;
  STABILITY_ALPHA = 2;
  STABILITY_BETA = 3;
  STABILITY_STABLE = 4;
}

message Deprecation {
  string sunset_date = 1;  // Required format: YYYY-MM-DD
}

message MethodOptions {
  repeated Operation operations = 1;
  // delegation carries per-RPC AI-guardrail tags. Describes the intrinsic
  // risk shape of the RPC, independent of the route(s) under operations[]
  // that expose it. Consumed by the lethal-trifecta translator in c1's
  // pkg/aigov/derive to produce per-turn capability scores.
  //
  // Field names and numbers in DelegationMeta mirror
  // bundle.v1.DelegationMeta in ductone/mcp-axiomatic so a single
  // translator can consume either surface. mcp-axiomatic encodes
  // equivalent values as strings (parsed by the translator); apigw uses
  // typed enums directly.
  DelegationMeta delegation = 2;
}

// Severity tier for AI-guardrail risk scoring. Aligned with NIST FIPS 199
// (LOW / MODERATE / HIGH), with an additional CRITICAL tier used by
// ductone/mcp-axiomatic for incident-grade risk. MEDIUM corresponds to
// FIPS 199 "MODERATE".
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_LOW = 1;
  SEVERITY_MEDIUM = 2;
  SEVERITY_HIGH = 3;
  SEVERITY_CRITICAL = 4;
}

// Action verb describing what the RPC does to its target resource(s).
// Orthogonal to apigw.Operation.method (the HTTP verb); a single gRPC
// method can be POST + MUTATION_SCOPE_DELETE, etc.
enum MutationScope {
  MUTATION_SCOPE_UNSPECIFIED = 0;
  MUTATION_SCOPE_READ = 1;
  MUTATION_SCOPE_CREATE = 2;
  MUTATION_SCOPE_UPDATE = 3;
  MUTATION_SCOPE_DELETE = 4;
  // ADMIN covers configuration / policy / governance / role / permission
  // changes — anything that alters how the system itself behaves, as
  // opposed to CRUD on tenant-owned data.
  MUTATION_SCOPE_ADMIN = 5;
}

// Default user-experience gate for the AI-guardrail policy engine when a
// call matches this RPC. Customer policy may override (e.g. promote AUTO
// to CONFIRM for sensitive tenants) but cannot soften below the tier the
// author declared.
enum DefaultTier {
  DEFAULT_TIER_UNSPECIFIED = 0;
  // Proceed without user prompt.
  DEFAULT_TIER_AUTO = 1;
  // Surface a one-click confirmation prompt before execution.
  DEFAULT_TIER_CONFIRM = 2;
  // Require a human approver (ticket / approval workflow) before execution.
  DEFAULT_TIER_APPROVE = 3;
}

message DelegationMeta {
  // Worst-case severity if this RPC is misused or its output exfiltrated.
  // Aligned with NIST FIPS 199; CRITICAL is reserved for incident-grade
  // risk (e.g. raw credential read, mass user delete).
  Severity risk_level = 1;
  // Default UX gating tier. AUTO / CONFIRM / APPROVE roughly correspond to
  // "auto-execute", "ask first", and "needs human ticket".
  DefaultTier default_tier = 2;
  // Whether the action can be undone by a counter-operation in the same
  // tenant (e.g. DeleteX reversible by CreateX with the same id). Unset
  // means unknown — caller should treat as not reversible.
  bool reversible = 3;
  // Action verb the RPC performs; see MutationScope.
  MutationScope mutation_scope = 4;
  // Free-form sensitivity tags consumed by downstream translators. Two
  // categories of tag are accepted on the same list:
  //   - Data category: "pii", "secrets", "financial", "production",
  //     "lifecycle" (the common mcp-axiomatic vocabulary).
  //   - Channel / side-effect markers: e.g. "outbound" (the RPC reaches
  //     out to an external system), "untrusted_output" (the RPC returns
  //     attacker-influenceable content that should be stamped untrusted
  //     when ingested into agent context).
  // The vocabulary is intentionally open; downstream consumers validate
  // against the set they know and warn on unknown values. Standardization
  // of channel/side-effect markers is tracked as follow-up.
  repeated string sensitivity_tags = 5;
  // privacy_class scores the trifecta cube's Axis 1 (Private Data Access)
  // contribution from this RPC: how sensitive is the data the RPC reads
  // and returns? Set independently from risk_level so the translator can
  // score A1 directly without having to disambiguate which axis
  // risk_level was set against.
  Severity privacy_class = 6;
  // exfil_class scores the trifecta cube's Axis 3 (Exfiltration) contribution
  // from this RPC: how exfil-friendly is the outbound channel this RPC
  // can reach? Internal-only RPCs leave this UNSPECIFIED. Set
  // independently from risk_level so A3 can be scored directly.
  Severity exfil_class = 7;
}

message ServiceOptions {
  Service service = 1;
}

message Service {
  Stability stability = 1;
  string docs_path = 2;
  Deprecation deprecation = 3;

  // Override the x-speakeasy-group value for every method in this service in
  // the generated OpenAPI spec. Use this to disambiguate v1/v2 proto service
  // pairs (e.g. c1.api.app.v1.AppOwners vs c1.api.app.v2.AppOwners) that
  // otherwise produce colliding SDK method receivers. Individual methods can
  // still override via Operation.group_override.
  string group_override = 4;
}

message TerraformEntity {
  enum TerraformEntityMethodType {
    TERRAFORM_ENTITY_METHOD_TYPE_UNSPECIFIED = 0;
    TERRAFORM_ENTITY_METHOD_TYPE_CREATE = 1;
    TERRAFORM_ENTITY_METHOD_TYPE_READ = 2;
    TERRAFORM_ENTITY_METHOD_TYPE_UPDATE = 3;
    TERRAFORM_ENTITY_METHOD_TYPE_DELETE = 4;
  }

  TerraformEntityMethodType type = 1;
  string name = 2;
  bool json = 3;
  int32 operation_number = 4;
  OptionalExclusion optional_exclusion = 5;

  enum OptionalExclusion {
    OPTIONAL_EXCLUSION_UNSPECIFIED = 0;
    // Exclude the field from the terraform resource
    OPTIONAL_EXCLUSION_RESOURCE_ONLY = 1;
    // Exclude the field from the terraform data source
    OPTIONAL_EXCLUSION_DATA_SOURCE_ONLY = 2;
  }
}

message Pagination {
  enum TerraformEntityPaginationType {
    TERRAFORM_ENTITY_PAGINATION_TYPE_UNSPECIFIED = 0;
    TERRAFORM_ENTITY_PAGINATION_TYPE_CURSOR = 1;
  }

  TerraformEntityPaginationType type = 1;
  repeated PaginationInput inputs = 2;
  PaginationOutput outputs = 3;
}

message PaginationInput {
  string name = 1;

  enum TerraformEntityPaginationInputIn {
    TERRAFORM_ENTITY_PAGINATION_INPUT_IN_UNSPECIFIED = 0;
    TERRAFORM_ENTITY_PAGINATION_INPUT_IN_REQUEST_BODY = 1;
  }
  TerraformEntityPaginationInputIn in = 2;

  enum TerraformEntityPaginationInputType {
    TERRAFORM_ENTITY_PAGINATION_INPUT_TYPE_UNSPECIFIED = 0;
    TERRAFORM_ENTITY_PAGINATION_INPUT_TYPE_CURSOR = 1;
  }
  TerraformEntityPaginationInputType type = 3;
}

message PaginationOutput {
  string next_cursor = 1;
}

message Operation {
  string method = 1;
  string route = 2;
  map<string, string> query = 3;
  Stability stability = 4;
  string docs_path = 5;
  repeated RequestExample request_examples = 6;
  repeated ResponseExample response_examples = 7;
  repeated TerraformEntity terraform_entity = 8;
  string summary = 9;
  string group = 10;
  Pagination pagination = 11;
  Deprecation deprecation = 12;

  // Override the x-speakeasy-group value for this operation. Takes precedence
  // over Service.group_override. Prefer Service.group_override unless a
  // single method genuinely needs to live in a different SDK namespace from
  // the rest of its service.
  string group_override = 13;

  // Override the x-speakeasy-name-override value for this operation. By
  // default the SDK method name is derived from the proto RPC method name.
  // Use this to resolve collisions when two operations in the same group
  // resolve to the same method name.
  string name_override = 14;
}

message RequestExample {
  string name = 1;
  string path = 2;
}

message ResponseExample {
  string name = 1;
  string path = 2;
}
